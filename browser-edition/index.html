<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Vault Folio — Browser Companion Prototype</title>
<style>
/* ============ VAULT FOLIO — archival registry aesthetic ============ */
:root{
  --ink:#0a0a0a;
  --ink-2:#2e2e2e;
  --ink-3:#6b6b6b;
  --ink-4:#9a9a9a;
  --paper:#fafaf8;
  --paper-2:#f2f1ec;
  --line:#e3e1da;
  --line-2:#c9c7bf;
  --flag:#b3282d;          /* crimson, used sparingly for risk flags */
  --ok:#2e6b4f;           /* deep green, derived from ink temperature */
  --serif:Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--ink);
  padding:14px 28px;display:flex;align-items:baseline;justify-content:space-between;
  position:sticky;top:0;background:var(--paper);z-index:50;
}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.02em}
.brand em{font-style:normal;color:var(--ink-3)}
.hdr-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--flag)}

main{max-width:880px;margin:0 auto;padding:48px 28px 120px}

/* ---------- folio labels & headings ---------- */
.folio{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px;display:flex;gap:12px;align-items:center}
.folio::after{content:"";flex:1;border-top:1px solid var(--line)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin-bottom:14px}
h3{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin:34px 0 12px}
p.lede{font-size:17px;color:var(--ink-2);max-width:62ch;margin-bottom:18px}
p.muted,.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.mono{font-family:var(--mono)}

/* ---------- rules / boxes ---------- */
.rule{border:none;border-top:1px solid var(--line);margin:34px 0}
.rule-ink{border:none;border-top:1px solid var(--ink);margin:34px 0}
.note{border-left:2px solid var(--ink);padding:10px 16px;background:var(--paper-2);margin:18px 0;font-size:13.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--flag)}
.note.warn strong{color:var(--flag)}
.note.ok{border-left-color:var(--ok)}

/* ---------- landing ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink);margin-top:38px}
.mode{padding:30px 28px;border-right:1px solid var(--ink)}
.mode:last-child{border-right:none}
.mode .folio{margin-bottom:10px}
.mode h3{margin:0 0 10px;font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:0;text-transform:none}
.mode p{font-size:13.5px;color:var(--ink-3);margin-bottom:20px;min-height:64px}
@media(max-width:700px){.modes{grid-template-columns:1fr}.mode{border-right:none;border-bottom:1px solid var(--ink)}.mode:last-child{border-bottom:none}}

/* ---------- buttons ---------- */
.btn{
  display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  cursor:pointer;text-decoration:none;transition:background .15s,color .15s;user-select:none;
}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--flag);background:var(--flag)}
.btn.danger:hover{background:transparent;color:var(--flag)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

/* ---------- wizard chrome ---------- */
.steps-bar{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line-2);margin-bottom:36px;background:var(--paper-2)}
.step-tab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:9px 13px;border-right:1px solid var(--line-2);color:var(--ink-4);cursor:pointer;flex:1;text-align:center;white-space:nowrap;transition:background .12s}
.step-tab:last-child{border-right:none}
.step-tab.done{color:var(--ink-2)}
.step-tab.done::before{content:"· "}
.step-tab.active{background:var(--ink);color:var(--paper)}
.step-tab:hover:not(.active){background:var(--line)}
.step-intro{color:var(--ink-2);margin-bottom:26px;max-width:66ch}
.step-intro em{font-family:var(--serif)}

/* ---------- form fields ---------- */
.field{margin-bottom:22px;max-width:640px}
.field>label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-2);background:#fff;
  font-family:var(--sans);font-size:14px;color:var(--ink);border-radius:0;
  transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
textarea{min-height:88px;resize:vertical;line-height:1.6}
select{cursor:pointer}
.radio-row,.check-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;font-size:14px}
.radio-row input,.check-row input{margin-top:4px;accent-color:var(--ink)}
.radio-row label,.check-row label{flex:1;cursor:pointer}
.radio-row .sub,.check-row .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.seg{display:flex;border:1px solid var(--line-2);width:fit-content;max-width:100%;flex-wrap:wrap}
.seg label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;cursor:pointer;border-right:1px solid var(--line-2);background:#fff;transition:background .12s,color .12s}
.seg label:last-child{border-right:none}
.seg input{display:none}
.seg label:has(input:checked){background:var(--ink);color:var(--paper)}

/* ---------- repeaters ---------- */
.rep-item{border:1px solid var(--line-2);background:#fff;margin-bottom:16px}
.rep-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--paper-2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.rep-head .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.rep-head .rm{font-family:var(--mono);font-size:10px;color:var(--flag);letter-spacing:.1em;text-transform:uppercase;background:none;border:none;cursor:pointer;padding:4px 6px}
.rep-head .rm:hover{text-decoration:underline}
.rep-body{padding:18px 16px}
.rep-add{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px dashed var(--line-2);color:var(--ink-2);padding:10px 18px;cursor:pointer;width:100%;transition:border-color .12s,color .12s}
.rep-add:hover{border-color:var(--ink);color:var(--ink)}
.nested{margin-left:0;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.nested>.nested-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}

/* ---------- nav footer of wizard ---------- */
.wiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.wiz-pos{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}

/* ---------- risk report ---------- */
.risk{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--line-2);background:#fff;margin-bottom:12px}
.risk .sev{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding-top:3px;min-width:86px}
.risk.critical{border-left:3px solid var(--flag)}
.risk.critical .sev{color:var(--flag)}
.risk.warning{border-left:3px solid #b8860b}
.risk.warning .sev{color:#8a6408}
.risk.info{border-left:3px solid var(--ink-4)}
.risk.info .sev{color:var(--ink-3)}
.risk .rt{font-weight:600;margin-bottom:3px}
.risk .rd{font-size:13.5px;color:var(--ink-2)}
.risk .rd .fix{color:var(--ink-3);display:block;margin-top:4px;font-size:12.5px}

/* ---------- summary table ---------- */
table.ledger{width:100%;border-collapse:collapse;margin:14px 0 26px;font-size:13.5px}
table.ledger th{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;text-align:left;color:var(--ink-3);border-bottom:1px solid var(--ink);padding:8px 10px 8px 0;font-weight:600}
table.ledger td{border-bottom:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top}
table.ledger td:first-child{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- export / crypto ---------- */
.pass-wrap{position:relative}
.pass-meter{height:3px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
.pass-meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .3s}
.file-drop{border:1px dashed var(--line-2);padding:34px;text-align:center;background:#fff;cursor:pointer;transition:border-color .12s}
.file-drop:hover{border-color:var(--ink)}
.file-drop .mono{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.prog{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);margin-top:14px;text-transform:uppercase}
.prog.err{color:var(--flag)}
.prog.okk{color:var(--ok)}

/* ---------- heir view ---------- */
.heir-banner{border:1px solid var(--ink);background:var(--paper-2);padding:22px 26px;margin-bottom:34px}
.heir-banner .folio{margin-bottom:8px}
.heir-banner h2{margin-bottom:6px}
.runbook h3{margin-top:40px}
.runbook ol.rec{padding-left:22px}
.runbook ol.rec li{margin-bottom:14px;line-height:1.7}
.runbook ol.rec li::marker{font-family:var(--mono);font-size:12px}
.checklist{list-style:none;margin:10px 0}
.checklist li{padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--line);font-size:14px}
.checklist li::before{content:"";position:absolute;left:2px;top:14px;width:12px;height:12px;border:1px solid var(--ink)}
.kv{display:grid;grid-template-columns:220px 1fr;gap:0;border:1px solid var(--line-2);background:#fff;margin:14px 0}
.kv>div{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.kv>div:nth-child(odd){font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-right:1px solid var(--line)}
.kv>div:nth-last-child(-n+2){border-bottom:none}
@media(max-width:600px){.kv{grid-template-columns:1fr}.kv>div:nth-child(odd){border-right:none;border-bottom:none;padding-bottom:2px}}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:12px 24px;opacity:0;transition:transform .25s,opacity .25s;z-index:99;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 28px;max-width:880px;margin:0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ---------- print (runbook) ---------- */
@media print{
  header,footer,.wiz-nav,.steps-bar,.btn-row,.no-print,#toast{display:none!important}
  body{background:#fff;font-size:11.5pt}
  main{max-width:none;padding:0}
  .screen-only{display:none!important}
  .print-only{display:block!important}
  .runbook h3{page-break-after:avoid}
  .risk,.kv,table.ledger{page-break-inside:avoid}
}
.print-only{display:none}

.hidden{display:none!important}

/* ---------- air-gap gate ---------- */
#gate{
  position:fixed;inset:0;background:var(--ink);color:var(--paper);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:28px;
}
#gate .gate-box{max-width:640px;width:100%;border:1px solid rgba(250,250,248,.25);padding:44px 42px;background:#111}
#gate .folio{color:var(--ink-4)}
#gate .folio::after{border-top-color:rgba(250,250,248,.2)}
#gate h2{color:var(--paper);font-size:30px;margin-bottom:14px}
#gate p{color:#b9b9b4;font-size:14px;margin-bottom:14px}
#gate .gate-list{list-style:none;margin:18px 0}
#gate .gate-list li{padding:10px 0 10px 26px;position:relative;border-bottom:1px solid rgba(250,250,248,.12);font-size:13.5px;color:#cfcfca}
#gate .gate-list li::before{content:"";position:absolute;left:2px;top:16px;width:11px;height:11px;border:1px solid #8a8a84}
#gate .gate-list li.bad::before{background:var(--flag);border-color:var(--flag)}
#gate .gate-list li.good::before{background:var(--ok);border-color:var(--ok)}
#gate .btn{border-color:var(--paper);background:var(--paper);color:var(--ink)}
#gate .btn:hover{background:transparent;color:var(--paper)}
#gate .btn.ghost{background:transparent;color:var(--paper);border-color:rgba(250,250,248,.4)}
#gate .btn.ghost:hover{background:var(--paper);color:var(--ink)}
#gate .prog{color:#8a8a84}
.attest{display:flex;gap:12px;align-items:flex-start;margin:20px 0;padding:16px;border:1px solid rgba(219,51,86,.5);font-size:13px;color:#e8b9be}
.attest input{margin-top:3px;accent-color:#db3356}
#lockOverlay{
  position:fixed;inset:0;background:rgba(10,10,10,.96);color:var(--paper);z-index:950;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
}
#lockOverlay .gate-box{max-width:560px}
</style>
</head>
<body>

<header>
  <div class="brand">Vault Folio <em>· Browser Companion Prototype</em></div>
  <div class="hdr-status"><span class="dot" id="netDot"></span><span id="netLabel">Offline tool</span></div>
</header>

<main id="app"><!-- rendered by JS --></main>

<footer>
  <span>Prototype for future side-panel integration with EntropyLab / Ooga Booga</span>
  <span>Not a hardware-enforcing offline app</span>
</footer>

<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   VAULT FOLIO
   An offline plan-authoring tool. It documents HOW a cold storage setup
   was built and HOW heirs recover it. It never touches keys, seeds,
   xprvs, or xpubs-by-value — it stores the map, not the treasure.
   ===================================================================== */

/* ---------------- state ---------------- */
const S = {
  mode: 'landing',          // landing | wizard | review | export | heir
  step: 0,
  plan: blankPlan(),
  dirty: false,
};

function blankPlan(){
  return {
    meta:{ app:'Vault Folio', version:1, created:new Date().toISOString().slice(0,10), planName:'', owner:'', jurisdiction:'', legalNotes:'' },
    people:{ executor:'', trustee:'', helper:'', heirs:[] },        // heir: {name, relation, role, contact, holdsKeyNow}
    vaults:[],                                                       // vault: {name, tier, m, n, script, coordinator, timelock:{enabled,delay,refreshNote}, notes, keys:[] }
    signing:{ medium:'', verifyRitual:[], testSpend:'', coordinatorNotes:'' },
    backups:{ descriptorLocations:[], watchOnly:'', rescanHeight:'', sampleAddresses:'', testedSoftware:'' },
    inheritance:{ mechanism:'', releaseConditions:'', legalDocs:'', letterLocation:'', heartbeat:'', canary:'' },
    rehearsal:{ restoreDrill:'', familyWalkthrough:'', testSpendDate:'', notes:'' },
    ownerNotes:'',
  };
}
// key: {label, device, generation, media, locations, passphrase}

const TIERS = ['Deep vault (no timelock)','Family vault (timelocked decay allowed)','Spending / liquidity wallet','Collaborative custody slice'];
const SCRIPTS = ['P2WSH — wsh(sortedmulti(...))','Taproot / Miniscript (Liana-style leaves)','Single-sig (small amounts only)','Not sure yet'];
const COORDS = ['Bitcoin Core (Yeti-style)','Sparrow Wallet','Nunchuk','Liana','Casa','Unchained','Specter','Other / undecided'];
const DEVICES = ['SeedSigner (stateless QR)','Krux (stateless QR)','Jade (stateless mode)','BitBox02-class (secure element)','Air-gapped laptop + Bitcoin Core','COLDCARD (see warning)','Trezor / other','Undecided'];
const GENMETHODS = ['Dice / coins / cards + offline calculator (EntropyLab)','Device RNG (device-generated)','Bitcoin Core wallet generation','Imported existing seed','Undecided'];
const MEDIA = ['Steel / metal plate','Paper (NATO-phonetic, checksum)','Archival optical disc + printed paper','Encrypted digital file','Hardware device only (no separate backup)'];
const PASSPHRASE = ['None — explicit record of that','Stored at a separate site','Sealed copy held by trustee','Memory only (dangerous)','Undecided'];
const MECHANISMS = [
  'Distributed keys — heirs reach a quorum via trustee/executor after death',
  'On-chain timelock decay — recovery path opens after inactivity (Liana/Nunchuk style)',
  'Collaborative custody inheritance program (Casa/Unchained/Nunchuk assisted)',
  'Letter + executor only (simple, single-sig or small amounts)',
  'Combination of the above',
  'Not decided yet'
];
const RITUAL = [
  ['qr','PSBT crosses the air gap by QR code (UR / animated)'],
  ['verify2','PSBT decoded on a second, independent tool before signing'],
  ['three','Three displays agree before signing: coordinator, second watch-only device, signer'],
  ['change','Change outputs confirmed to belong to the wallet'],
  ['small','Small test transaction before any large spend'],
  ['never2','Never two quorum seeds loaded on one signer in one session'],
];

/* ---------------- persistence-free by design ---------------- */
window.addEventListener('beforeunload', e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------------- tiny dom helpers ---------------- */
const el = (tag, attrs={}, ...kids)=>{
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') n.className=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  for(const kid of kids){ if(kid==null) continue; n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
};
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function markDirty(){ S.dirty=true; }

/* ---------------- network honesty ---------------- */
function updateNet(){
  const off = !navigator.onLine;
  document.getElementById('netLabel').textContent = off ? 'Offline — good' : 'Online — consider disconnecting';
  document.getElementById('netDot').className = 'dot' + (off?'':' warn');
}
window.addEventListener('online',updateNet); window.addEventListener('offline',updateNet);
</script>
<script>
'use strict';
/* =====================================================================
   PART 2 — WIZARD: step schema + rendering engine
   ===================================================================== */

const STEPS = [
  {
    id:'start', folio:'Folio · 00 · Before anything', title:'Read this first',
    custom:'start',
  },
  {
    id:'identity', folio:'Folio · 01 · The plan', title:'Plan & owner',
    intro:'Name this plan and its owner. This document is the brain of your cold storage setup — it describes the structure so the right people can rebuild or recover it. It must never contain seed words, private keys, or xpubs-by-value.',
    fields:[
      {k:'planName', path:'meta.planName', label:'Plan name', ph:'e.g. “Family Bitcoin Custody Plan — 2026”', hint:'Something your executor would recognize.'},
      {k:'owner', path:'meta.owner', label:'Owner', ph:'Your name', hint:'The person this plan protects the family of.'},
      {k:'created', path:'meta.created', label:'Date prepared', type:'date'},
      {k:'jurisdiction', path:'meta.jurisdiction', label:'Jurisdiction / legal context', ph:'e.g. Oregon, USA — revocable living trust in place', hint:'Country/state, and whether a will or trust references this plan. The will should point to this file — it should never contain seeds or hiding places.'},
      {k:'legalNotes', path:'meta.legalNotes', label:'Legal notes (optional)', type:'textarea', ph:'Trust name, attorney, probate considerations, cross-border issues…'},
    ],
  },
  {
    id:'people', folio:'Folio · 02 · The people', title:'Executors, trustees, heirs',
    intro:'Who must be able to act when you cannot? Separate technical assistance from financial control: a helper can guide recovery without holding any key.',
    fields:[
      {k:'executor', path:'people.executor', label:'Executor / next of kin', ph:'Name — who legally settles the estate', hint:'This person finds the plan and starts the process. They do not need to be technical.'},
      {k:'trustee', path:'people.trustee', label:'Trustee / guardian of the map', ph:'Name — who holds sealed instructions', hint:'Ideally holds the location map and (optionally) one delayed/recovery key, sealed — never a live quorum.'},
      {k:'helper', path:'people.helper', label:'Bitcoin-competent helper', ph:'Name — a technical person who holds NO keys', hint:'Someone who can verify software and walk the family through recovery. If they hold no key, their compromise cannot spend. Write in the runbook: nobody legitimate will ever email or call to “validate the wallet.”'},
    ],
    repeater:{
      path:'people.heirs', label:'Heirs / beneficiaries', addLabel:'Add an heir',
      itemTitle:(it,i)=>it.name||('Heir '+(i+1)),
      fields:[
        {k:'name', label:'Name', ph:'Full name'},

/* ---------- path helpers ---------- */
function getPath(obj,path){ return path.split('.').reduce((o,k)=>o?.[k],obj); }
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]??(o[ks[i]]={}); } o[ks[ks.length-1]]=val; }

/* ---------- field renderers ---------- */
function renderField(f, host){
  const wrap=el('div',{class:'field'});
  wrap.append(el('label',{},f.label));
  const cur = getPath(S.plan,f.path);
  let input;
  if(f.type==='textarea'){
    input=el('textarea',{placeholder:f.ph||''}); input.value=cur||'';
    input.addEventListener('input',()=>{setPath(S.plan,f.path,input.value);markDirty();});
  } else if(f.type==='select'){
    input=el('select',{});
    input.append(el('option',{value:''},'— choose —'));
    for(const o of f.options) input.append(el('option',{value:o},o));
    input.value=cur||'';
    input.addEventListener('change',()=>{setPath(S.plan,f.path,input.value);markDirty();});
  } else if(f.type==='date'){
    input=el('input',{type:'date'}); input.value=cur||'';
    input.addEventListener('input',()=>{setPath(S.plan,f.path,input.value);markDirty();});
  } else if(f.type==='checkboxes'){
    const arr=Array.isArray(cur)?cur:[];
    f.options.forEach((label,i)=>{
      const val=f.values[i];
      const cb=el('input',{type:'checkbox'});
      cb.checked=arr.includes(val);
      cb.addEventListener('change',()=>{
        const a=Array.isArray(getPath(S.plan,f.path))?getPath(S.plan,f.path):[];
        const idx=a.indexOf(val);
        if(cb.checked&&idx<0)a.push(val); if(!cb.checked&&idx>=0)a.splice(idx,1);
        setPath(S.plan,f.path,a); markDirty();
      });
      wrap.append(el('div',{class:'check-row'},cb,el('label',{},label)));
    });
    if(f.hint) wrap.append(el('div',{class:'hint'},f.hint));
    host.append(wrap); return;
  } else {
    input=el('input',{type:'text',placeholder:f.ph||''}); input.value=cur||'';
    input.addEventListener('input',()=>{setPath(S.plan,f.path,input.value);markDirty();});
  }
  wrap.append(input);
  if(f.hint) wrap.append(el('div',{class:'hint'},f.hint));
  host.append(wrap);
}

function renderRepeater(r, host){
  host.append(el('h3',{},r.label));
  if(r.hint) host.append(el('p',{class:'small muted',style:'margin-bottom:14px'},r.hint));
  const arr=getPath(S.plan,r.path);
  const list=el('div',{});
  host.append(list);
  const draw=()=>{
    list.innerHTML='';
    arr.forEach((item,i)=>{
      const box=el('div',{class:'rep-item'});
      const head=el('div',{class:'rep-head'},
        el('span',{class:'t'},r.itemTitle(item,i)),
        el('button',{class:'rm',onclick:(e)=>{e.stopPropagation(); arr.splice(i,1); markDirty(); draw();}},'Remove'));
      const body=el('div',{class:'rep-body'});
      r.fields.forEach(f=>{
        const rf={...f,path:r.path+'.'+i+'.'+f.k};
        renderField(rf,body);
      });
      box.append(head,body); list.append(box);
    });
  };
  draw();
  host.append(el('button',{class:'rep-add',onclick:()=>{ arr.push({}); markDirty(); draw(); }},'+ '+r.addLabel));
}

/* ---------- risk engine ---------- */
function analyzePlan(p){
  const out=[];
  const add=(sev,title,detail,fix)=>out.push({sev,title,detail,fix});
  const locs={}; // normalized location -> [{vault,key}]
  let allDevices=new Set(), allGen=new Set(), anyTimelock=false, anyPassphraseMemory=false, totalKeys=0;

  p.vaults.forEach((v,vi)=>{
    const vn=v.name||('Vault '+(vi+1));
    if(v.timelock?.enabled) anyTimelock=true;
    const expected=+v.n||0;
    if(expected && (v.keys?.length||0)!==expected)
      add('warning',`${vn}: key count mismatch`,`Quorum says ${v.m||'?'}-of-${v.n} but ${v.keys?.length||0} keys are documented.`,'Document every key — heirs can only plan around what is written down.');
    (v.keys||[]).forEach((k,ki)=>{
      totalKeys++;
      const kn=(k.label||('Key '+(ki+1)))+' ('+vn+')';
      if(k.device) allDevices.add(k.device);
      if(k.generation) allGen.add(k.generation);
      if(k.media==='Hardware device only (no separate backup)')
        add('critical',`${kn}: no backup beyond the device`,'Hardware wallets fail, screens break, companies disappear. A device is a signer, not a backup.','Stamp the seed words into steel (or your chosen durable medium) and store it apart from the device.');
      if(k.passphrase==='Memory only (dangerous)') anyPassphraseMemory=true;
      (k.locations||'').split(';').map(s=>s.trim()).filter(Boolean).forEach(loc=>{
        const key=loc.toLowerCase();
        locs[key]=locs[key]||[]; locs[key].push({vault:vn,m:+v.m||1,kn});
      });
    });
  });

  // quorum-in-one-location check (per vault)
  for(const [loc,holders] of Object.entries(locs)){
    const byVault={};
    holders.forEach(h=>{byVault[h.vault]=byVault[h.vault]||new Set(); byVault[h.vault].add(h.kn);});
    for(const [vn,keys] of Object.entries(byVault)){
      const m=holders.find(h=>h.vault===vn)?.m||1;
      if(keys.size>=m)
        add('critical',`One location can reach a spending quorum`,`“${loc}” holds backups for ${keys.size} key(s) of ${vn}, which needs ${m}. Fire, burglary, or one dishonest person at that site can spend.`,'Redistribute so no single location holds M or more keys of any vault.');
    }
  }

  if(totalKeys>0 && allDevices.size===1 && p.vaults.some(v=>+v.n>1))
    add('warning','Signer monoculture',`Every documented key uses the same device type (${[...allDevices][0]}). One firmware bug or supply-chain failure reaches the whole quorum.`,'Prefer different manufacturers across the quorum. Diversity helps against device backdoors — though it never replaces user-supplied entropy.');
  if(totalKeys>0 && allGen.size===1 && [...allGen][0]==='Device RNG (device-generated)' && p.vaults.some(v=>+v.n>1))
    add('warning','All keys born from device RNGs','The 2026 Coldcard incident showed device RNGs can silently fail, and fixed firmware does not heal a weak seed. Multisig contains the damage — unless two weak keys sit in one quorum.','For future key ceremonies, supply your own entropy (dice/coins/cards) through a verified offline calculator, and verify the derived address with a second independent program.');
  if(anyPassphraseMemory)
    add('critical','A passphrase exists only in someone’s memory','If that person dies or forgets, the passphrase-protected keys are gone forever — while the backups look perfectly fine.','Write it down, store it apart from the words, and give the trustee a sealed copy.');
  if(p.backups.descriptorLocations.length===0)
    add('critical','No descriptor / wallet-configuration backup recorded','Multisig seeds alone do not reconstruct the wallet. Without the descriptor (script type, cosigner xpubs, threshold, timelocks) heirs may hold the keys and still be unable to recover.','Add descriptor copies: one with every key backup, one with the trustee, one on the watch-only machine.');
  else if(p.backups.descriptorLocations.length<2)
    add('warning','Only one descriptor copy recorded','The map is as load-bearing as the keys. One copy is one failure away from an unrecoverable quorum.','Distribute at least 2–3 copies across the same sites as the key backups.');
  if(!p.backups.rescanHeight)
    add('info','No wallet birthday / rescan height recorded','A restorer who starts from the wrong height may conclude the coins are gone.','Record a block height or month/year of wallet creation with each descriptor copy.');
  if((p.backups.sampleAddresses||'').startsWith('Not'))
    add('info','No sample receiving addresses recorded','2–3 known addresses let heirs verify a restore BEFORE trusting it with a spend.','Note a few previously used addresses alongside the descriptor copies.');

  // inheritance
  const heirs=p.people.heirs||[];
  if(heirs.some(h=>h.holdsKeyNow==='Yes — intentional co-signer'))
    add('warning','An heir holds a live quorum key today','They can be targeted, coerced, or collude with whoever holds another live key — regardless of what any will says. Bitcoin checks signatures, not intentions.','If intentional, document WHY. Otherwise move their key to a sealed/delayed role.');
  if(!p.people.helper)
    add('info','No Bitcoin-competent helper named','A grieving family is a target for “wallet support” scammers. A named, trusted, keyless helper separates technical assistance from financial control.','Name one, and write in the runbook that nobody legitimate will ever call or email to validate the wallet.');
  if(!p.inheritance.mechanism || p.inheritance.mechanism==='Not decided yet')
    add('warning','Inheritance mechanism undecided','The plan documents the vault but not the succession. This is the piece most setups skip — and where most inheritances fail.','Choose: distributed keys via trustee, on-chain timelock decay, an assisted program, or a documented combination.');
  if(anyTimelock && !p.inheritance.heartbeat)
    add('critical','Timelocked path with no refresh routine','The clock applies to each coin individually and only resets via confirmed on-chain transactions. Miss it, and the recovery path opens while you are alive.','Set an annual consolidation habit and a calendar reminder further out than one missed year.');
  if(p.inheritance.mechanism?.includes('Collaborative') )
    add('info','Assisted custody is part of the plan','Providers can make recovery easier, but their disappearance must not make recovery impossible. Confirm heirs can recover sovereignly: enough non-provider keys plus the wallet configuration.','Test the exit: rehearse recovery without the provider at least once.');

  // rehearsal
  if((p.rehearsal.restoreDrill||'').startsWith('Not'))
    add('critical','Restore drill never done','Nobody has proven a physical backup actually restores onto a blank signer. Untested backups are stories.','Restore one key from steel, on a blank device, before calling this plan finished.');
  if((p.rehearsal.familyWalkthrough||'').startsWith('Not'))
    add('warning','Family has never walked the recovery path','The plan exists only in your head until someone else can find the instructions and the map without you.','Once, while everyone is calm: have the heir open the runbook and locate the descriptor unaided.');
  if((p.signing.testSpend||'').startsWith('Not yet'))
    add('critical','No test spend completed','The signing procedure has never been exercised end-to-end. Coordinators and signers drift with upgrades.','Send a small amount through the full cycle: build PSBT, cross the gap, sign, verify, broadcast.');
  if(p.signing.medium==='USB stick (last resort)')
    add('info','USB crosses the air gap','USB is a tunnel: it carries arbitrary data both ways. Prefer QR (UR/animated) or SD where the signer supports it.','If USB is unavoidable, dedicate the stick, and decode the PSBT independently on both sides.');

  if(out.length===0)
    add('info','No structural weaknesses detected','Based on what is documented. This review checks structure, not execution — physical security and discipline remain yours.','Keep the rehearsal log current.');
  const order={critical:0,warning:1,info:2};
  return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

/* ---------- review custom step ---------- */
function renderReview(host){

  host.append(el('div',{class:'folio'},'Folio · 08 · Examination'));
  host.append(el('h2',{},'Risk review'));

  const counts={critical:0,warning:0,info:0}; findings.forEach(f=>counts[f.sev]++);
  host.append(el('p',{class:'mono small',style:'margin-bottom:18px;letter-spacing:.14em;text-transform:uppercase'},
    `${counts.critical} critical · ${counts.warning} warnings · ${counts.info} notes`));
  findings.forEach(f=>{
    host.append(el('div',{class:'risk '+f.sev},
      el('div',{class:'sev'},f.sev),
      el('div',{},el('div',{class:'rt'},f.title),el('div',{class:'rd'},f.detail, f.fix?el('span',{class:'fix'},'→ '+f.fix):null))));
  });
  host.append(el('h3',{},'Plan summary'));
  host.append(renderSummaryTable(S.plan));
  host.append(el('div',{class:'field',style:'margin-top:26px'}));
  const notes=el('textarea',{placeholder:'Owner notes — anything the family should know that the fields did not capture (kept in the encrypted file)…'});
  notes.value=S.plan.ownerNotes||''; notes.addEventListener('input',()=>{S.plan.ownerNotes=notes.value;markDirty();});
  const nw=el('div',{class:'field'});nw.append(el('label',{},'Owner notes (encrypted with the plan)'),notes);host.append(nw);
}

function renderSummaryTable(p){
  const t=el('table',{class:'ledger'});
  t.append(el('thead',{},el('tr',{},el('th',{},'Entry'),el('th',{},'Value'))));
  const tb=el('tbody',{});
  const row=(k,v)=>{if(v==null||v===''||(Array.isArray(v)&&!v.length))return; tb.append(el('tr',{},el('td',{},k),el('td',{},Array.isArray(v)?v.join('; '):String(v))));};
  row('Plan',p.meta.planName); row('Owner',p.meta.owner); row('Prepared',p.meta.created);
  row('Executor',p.people.executor); row('Trustee',p.people.trustee); row('Helper',p.people.helper);
  row('Heirs',(p.people.heirs||[]).map(h=>h.name).filter(Boolean));
  p.vaults.forEach((v,i)=>{
    row(`Vault ${i+1}`,[v.name,v.tier,`${v.m||'?'}-of-${v.n||'?'}`,v.script,v.coordinator,v.timelock?.enabled?('timelock: '+v.timelock.delay):null].filter(Boolean).join(' · '));
    (v.keys||[]).forEach((k,ki)=>row(` · Key ${ki+1}`,[k.label,k.device,k.media,k.locations].filter(Boolean).join(' · ')));
  });
  row('Inheritance',p.inheritance.mechanism);
  row('Descriptor copies',(p.backups.descriptorLocations||[]).map(d=>d.where).filter(Boolean));
  t.append(tb); return t;
}

<script>
'use strict';
/* =====================================================================
   PART 4 — crypto, export/import, heir runbook, shell
   ===================================================================== */

/* ---------- WebCrypto: PBKDF2-SHA256 + AES-256-GCM ---------- */
const ENC_MAGIC='VAULTFOLIO/1';
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function encryptPlan(plan, passphrase, onProg){
  onProg?.('Deriving key (PBKDF2-SHA-256, 600,000 rounds)…');
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},km,{name:'AES-GCM',length:256},false,['encrypt']);
  onProg?.('Encrypting plan (AES-256-GCM)…');
  const pt=new TextEncoder().encode(JSON.stringify(plan));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pt);
  return { magic:ENC_MAGIC, kdf:{name:'PBKDF2',hash:'SHA-256',iterations:600000,salt:b64e(salt)}, cipher:{name:'AES-256-GCM',iv:b64e(iv)}, data:b64e(ct) };
}
async function decryptPlan(env, passphrase, onProg){
  if(!env || typeof env!=='object' || env.magic!==ENC_MAGIC) throw new Error('Not a Vault Folio file.');
  if(Object.keys(env).length!==4 || env.kdf?.name!=='PBKDF2' || env.kdf?.hash!=='SHA-256' ||
     env.kdf?.iterations!==600000 || env.cipher?.name!=='AES-256-GCM') throw new Error('Unsupported or malformed encryption parameters.');
  onProg?.('Deriving key (this takes a few seconds by design)…');
  let salt,iv,ct;
  try { salt=b64d(env.kdf.salt); iv=b64d(env.cipher.iv); ct=b64d(env.data); }
  catch(e){ throw new Error('Malformed encrypted plan.'); }
  if(salt.length!==16 || iv.length!==12 || ct.length<16 || ct.length>10*1024*1024+16) throw new Error('Malformed encrypted plan.');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:env.kdf.iterations},km,{name:'AES-GCM',length:256},false,['decrypt']);
  try{
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    if(pt.byteLength>10*1024*1024) throw new Error('Plan is too large.');
    const plan=JSON.parse(new TextDecoder().decode(pt));
    if(!plan || typeof plan!=='object' || Array.isArray(plan)) throw new Error('Malformed plan document.');
    return plan;
  }catch(e){ throw new Error('Wrong passphrase, or the file is corrupted.'); }
}
function download(filename, text){
  const a=el('a',{href:URL.createObjectURL(new Blob([text],{type:'application/json'})),download:filename});
  document.body.append(a); a.click(); a.remove();
}
function readFile(file){ return new Promise((res,rej)=>{ if(file.size>10*1024*1024){rej(new Error('File is too large.'));return;} const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }

/* ---------- export custom step ---------- */
function renderExport(host){
  host.append(el('div',{class:'folio'},'Folio · 09 · Sealing the file'));
  host.append(el('h2',{},'Encrypt & export the inheritance file'));
  host.append(el('p',{class:'step-intro'},'The plan is sealed with a passphrase using AES-256-GCM (key derived with PBKDF2-SHA-256, 600,000 rounds). The encrypted file is safe to back up in many places. The passphrase must travel by a different road — sealed with the trustee, split with a lawyer, memorized by two people. Whoever holds file + passphrase can read the plan.'));

  host.append(el('div',{class:'note warn'},el('strong',{},'The passphrase problem is yours to solve deliberately. '),'If the passphrase dies with you, this file is a brick. Recommended: sealed copy with the trustee, plus instructions in the sealed letter on who holds it.'));

  const pw=el('div',{class:'field'});
  pw.append(el('label',{},'Encryption passphrase'));
  const pi=el('input',{type:'password',placeholder:'Long and memorable beats short and clever'});
  const meter=el('div',{class:'pass-meter'},el('i',{style:'width:0%'}));
  pi.addEventListener('input',()=>{ const v=pi.value; const s=Math.min(100,(v.length/24)*100); meter.firstChild.style.width=s+'%'; });
  pw.append(pi,meter,el('div',{class:'hint'},'Aim for 4+ random words or 20+ characters. Write it down and store it apart from this file.'));
  const pw2=el('div',{class:'field'});
  pw2.append(el('label',{},'Confirm passphrase'));
  const pi2=el('input',{type:'password'});
  pw2.append(pi2);
  host.append(pw,pw2);

  const prog=el('div',{class:'prog'},'');
  host.append(prog);

  const row=el('div',{class:'btn-row'});
  const bEnc=el('button',{class:'btn'},'Download encrypted plan file');
  bEnc.addEventListener('click',async()=>{
    if(!pi.value||pi.value.length<8){prog.className='prog err';prog.textContent='Passphrase too short (min 8 characters).';return;}
    if(pi.value!==pi2.value){prog.className='prog err';prog.textContent='Passphrases do not match.';return;}
    prog.className='prog';bEnc.disabled=true;
    try{
      const env=await encryptPlan(S.plan,pi.value,m=>prog.textContent=m);
      const name=(S.plan.meta.planName||'cold-storage-plan').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      download(name+'.csp.json',JSON.stringify(env,null,2));
      prog.className='prog okk';prog.textContent='Sealed. Store copies of this file in at least two places; the passphrase travels separately.';
      S.dirty=false;
      pi.value='';pi2.value='';
    }catch(e){prog.className='prog err';prog.textContent='Encryption failed: '+e.message;}
    bEnc.disabled=false;
  });
  row.append(bEnc);
  host.append(el('p',{class:'small muted',style:'margin-top:14px'},'The only file this tool produces is encrypted. There is no plaintext export — the map never exists on disk unsealed.'));
  host.append(row);

  host.append(el('h3',{},'Where copies of the encrypted file should live'));
  host.append(el('ul',{class:'checklist'},
    el('li',{},'With the trustee / executor (they also need to know the passphrase exists and who holds it)'),
    el('li',{},'With the attorney, attached to the estate documents'),
    el('li',{},'On the watch-only machine, next to the descriptor copies'),
    el('li',{},'In at least one geographically separate location')));
  host.append(el('p',{class:'small muted',style:'margin-top:16px'},'To update the plan later: reopen this page, open your encrypted file, edit, and export a fresh sealed copy. Nothing is stored in the browser.'));
}

/* ---------- in-app heir runbook renderer ---------- */
function buildRunbook(p){
  const frag=el('div',{class:'runbook'});
  frag.append(el('div',{class:'folio'},'Inheritance runbook · generated from the plan file'));
  frag.append(el('h2',{},(p.meta.planName||'Cold Storage Plan')));
  frag.append(el('p',{class:'muted'},`Owner: ${p.meta.owner||'—'} · Prepared: ${p.meta.created||'—'}`));

  frag.append(el('div',{class:'note warn'},
    el('strong',{},'Read first. '),
    'Nobody legitimate will ever email or call you to “validate” or “recover” this wallet. Anyone who does is a thief. Move slowly, verify everything, and send a small test transaction before moving any real amount.'));

  frag.append(el('h3',{},'1 · Who to contact'));
  const kv=el('div',{class:'kv'});
  const kvr=(k,v)=>{if(v)kv.append(el('div',{},k),el('div',{},v));};
  kvr('Executor / next of kin',p.people.executor);
  kvr('Trustee (holds the map)',p.people.trustee);
  kvr('Technical helper (holds NO keys)',p.people.helper);
  (p.people.heirs||[]).forEach((h,i)=>kvr('Heir '+(i+1),[h.name,h.relation,h.role,h.contact].filter(Boolean).join(' · ')));
  frag.append(kv);

  frag.append(el('h3',{},'2 · What exists'));
  if(!p.vaults.length) frag.append(el('p',{class:'muted'},'No vaults documented.'));
  p.vaults.forEach((v,i)=>{
    const box=el('div',{class:'kv'});
    const r=(k,val)=>{if(val)box.append(el('div',{},k),el('div',{},val));};
    r('Vault',v.name||('Vault '+(i+1)));
    r('Purpose',v.tier);
    r('Quorum',(v.m&&v.n)?`${v.m}-of-${v.n} — any ${v.m} of ${v.n} keys can spend`:null);
    r('Script',v.script);
    r('Coordinator',v.coordinator);
    if(v.timelock?.enabled) r('Timelock',v.timelock.delay||'Yes — details not recorded');
    if(v.notes) r('Notes',v.notes);
    (v.keys||[]).forEach((k,ki)=>{
      r('Key '+(ki+1)+(k.label?' — '+k.label:''),
        [k.device&&('Signer: '+k.device), k.media&&('Backup: '+k.media), k.locations&&('Where: '+k.locations),
         k.passphrase&&('Seed-passphrase backup status: '+k.passphrase)].filter(Boolean).join('  |  '));
    });
    frag.append(box);
    const routes=recoveryRoutes(v);
    if(routes.length){
      const shown=routes.slice(0,10);
      frag.append(el('p',{class:'small',style:'margin-top:6px'},
        el('strong',{},`Recovery routes for ${v.name||'this vault'} — any ${v.m} of ${routes[0] ? (v.keys||[]).length : v.n} keys spend. `),
        `${routes.length} combination${routes.length>1?'s':''} exist${routes.length>10?'; first 10 shown':''}:`));
      const rl=el('ul',{class:'checklist'});
      shown.forEach(c=>rl.append(el('li',{},c.map(k=>`${k.name} (${k.where})`).join('  +  '))));
      frag.append(rl);
    }
  });

  frag.append(el('h3',{},'3 · The map (wallet descriptor)'));
  frag.append(el('p',{},'The descriptor reconstructs the wallet: script type, all cosigner public keys, threshold, and any timelock. The seeds alone are NOT enough for a multisig. Copies of the descriptor live at:'));
  const ul=el('ul',{class:'checklist'});
  (p.backups.descriptorLocations||[]).forEach(d=>ul.append(el('li',{},[d.where,d.format&&('('+d.format+')')].filter(Boolean).join(' '))));
  if(!p.backups.descriptorLocations.length) ul.append(el('li',{},'⚠ Not documented — ask the trustee; check with each key backup.'));
  frag.append(ul);
  const det=el('div',{class:'kv'});
  if(p.backups.watchOnly) det.append(el('div',{},'Watch-only wallet'),el('div',{},p.backups.watchOnly));
  if(p.backups.rescanHeight) det.append(el('div',{},'Rescan from'),el('div',{},p.backups.rescanHeight));
  if(p.backups.testedSoftware) det.append(el('div',{},'Software that worked'),el('div',{},p.backups.testedSoftware));
  if(p.backups.sampleAddresses?.startsWith('Yes')) det.append(el('div',{},'Verification addresses'),el('div',{},'Recorded with the descriptor copies — a restored wallet must reproduce them.'));
  if(det.children.length) frag.append(det);

  frag.append(el('h3',{},'4 · How recovery works'));
  frag.append(el('p',{},p.inheritance.mechanism||'Not documented.'));
  if(p.inheritance.releaseConditions) frag.append(el('p',{},p.inheritance.releaseConditions));
  if(p.inheritance.letterLocation) frag.append(el('p',{},el('strong',{},'Sealed instructions: '),p.inheritance.letterLocation));
  if(p.inheritance.legalDocs) frag.append(el('p',{},el('strong',{},'Legal documents: '),p.inheritance.legalDocs));

  frag.append(el('h3',{},'5 · Recovery procedure'));
  frag.append(el('p',{class:'muted'},'Generic PSBT flow — adapt to the coordinator named above. The technical helper should verify current software before starting.'));
  frag.append(el('ol',{class:'rec'},
    el('li',{},'Gather the required number of keys for the quorum — each from its own location, ideally with the people named above. Never enter seeds into a website or give them to anyone who contacts you.'),
    el('li',{},'Locate a descriptor copy. Import it into the named coordinator (or Bitcoin Core / Sparrow as a fallback) to build a watch-only wallet. Rescan from the recorded height. Confirm the balance and that a recorded receiving address belongs to the wallet.'),
    el('li',{},'Create a SMALL test transaction to a destination the family fully controls. Cross to the signing device(s) by '+(p.signing.medium||'the recorded method')+'.'),
    el('li',{},'On each signer: verify destination, amount, and fee on the device screen. If anything differs from what the coordinator showed — stop.'),
    el('li',{},'Collect the required signatures (one signer per session; never load a quorum of seeds onto one machine), finalize, and broadcast from the online machine.'),
    el('li',{},'Only after the test confirms on-chain: repeat for the real amounts, preferably into a fresh wallet the heirs control.')));
  const rit=(p.signing.verifyRitual||[]).map(v=>(RITUAL.find(r=>r[0]===v)||[])[1]).filter(Boolean);
  if(rit.length){ frag.append(el('p',{class:'small muted'},'Owner’s standing verification ritual: '+rit.join(' · '))); }

  frag.append(el('h3',{},'6 · Maintenance (while the owner is alive)'));
  if(p.inheritance.heartbeat) frag.append(el('p',{},el('strong',{},'Timelock refresh: '),p.inheritance.heartbeat));
  if(p.inheritance.canary) frag.append(el('p',{},el('strong',{},'Canary: '),p.inheritance.canary));
  const reh=[];
  if(p.rehearsal.restoreDrill) reh.push('Restore drill: '+p.rehearsal.restoreDrill);
  if(p.rehearsal.familyWalkthrough) reh.push('Family walkthrough: '+p.rehearsal.familyWalkthrough);
  if(p.rehearsal.testSpendDate) reh.push('Last test spend: '+p.rehearsal.testSpendDate);
  if(reh.length) frag.append(el('p',{},el('strong',{},'Rehearsal status: '),reh.join(' · ')));
  if(p.ownerNotes) { frag.append(el('h3',{},'7 · Owner’s notes')); frag.append(el('p',{},p.ownerNotes)); }
  frag.append(el('p',{class:'small muted',style:'margin-top:40px'},'Generated by Vault Folio — an offline, single-file planning tool. This runbook contains no keys. Untested backups are stories: rehearse before it matters.'));
  return frag;
}

/* ---------- home (post-gate): file-first ---------- */
function renderHome(){
  const m=document.getElementById('app'); m.innerHTML='';
  m.append(el('div',{class:'folio'},'Browser companion · plugin integration prototype'));

   ['Where descriptor copies live, rescan height, tested software','Passphrases to seeds'],

   ['Rehearsal log: restore drills, test spends, walkthroughs','Anything a thief could spend with directly'],
  ].forEach(([a,b])=>tb.append(el('tr',{},el('td',{},a),el('td',{},b))));

/* ---------- open file flow ---------- */
function openFileFlow(){
  const inp=el('input',{type:'file',accept:'.csp,.json,application/json'});
  inp.addEventListener('change',async()=>{
    const f=inp.files[0]; if(!f) return;
    let env; try{ env=JSON.parse(await readFile(f)); }catch(e){ toast('Not a readable JSON file'); return; }
    if(env && typeof env==='object' && !Array.isArray(env) && env.magic===ENC_MAGIC){
      showDecrypt(env);
    } else toast('Only encrypted Vault Folio JSON plans are supported');
  });
  inp.click();
}

function showDecrypt(env){
  const m=document.getElementById('app'); m.innerHTML='';
  m.append(el('div',{class:'folio'},'File · Sealed plan'));
  m.append(el('h2',{},'This plan file is sealed'));
  m.append(el('p',{class:'step-intro'},'Enter the passphrase to open it. Decryption happens entirely on this machine — the passphrase never leaves this page.'));
  const w=el('div',{class:'field'}); w.append(el('label',{},'Passphrase'));
  const pi=el('input',{type:'password'}); w.append(pi); m.append(w);
  const prog=el('div',{class:'prog'},''); m.append(prog);
  const go=async()=>{
    prog.className='prog';
    try{
      const plan=await decryptPlan(env,pi.value,t=>prog.textContent=t);
      pi.value=''; prog.textContent='';
      showOpenChoice(plan);
    }catch(e){ prog.className='prog err'; prog.textContent=e.message; }
  };
  pi.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  m.append(el('div',{class:'btn-row'},el('button',{class:'btn',onclick:go},'Open')));
  window.scrollTo(0,0);
}
function showOpenChoice(plan){
  const m=document.getElementById('app'); m.innerHTML='';
  m.append(el('div',{class:'folio'},'File · Opened'));
  m.append(el('h2',{},'Plan opened: '+(plan.meta.planName||'untitled')));
  m.append(el('p',{class:'step-intro'},'Who is opening this file?'));
  m.append(el('div',{class:'btn-row'},
    el('button',{class:'btn',onclick:()=>{S.plan=plan;S.mode='wizard';S.step=0;S.dirty=false;renderWizard();}},'I am the owner — edit the plan'),
    el('button',{class:'btn ghost',onclick:()=>showHeir(plan)},'I am family / executor / counsel — show me the recovery runbook')));
  window.scrollTo(0,0);
}
function showHeir(plan){
  const m=document.getElementById('app'); m.innerHTML='';
  m.append(el('div',{class:'heir-banner'},
    el('div',{class:'folio'},'Recovery mode · read-only'),
    el('h2',{},'Heir & executor runbook'),
    el('p',{class:'muted small'},'This view turns the sealed plan into a step-by-step recovery guide. Follow it slowly and test with a small amount first.')));
  m.append(buildRunbook(plan));
  m.append(el('div',{class:'btn-row'},el('button',{class:'btn ghost',onclick:renderHome},'Close')));
  window.scrollTo(0,0);
}

/* ---------- wizard shell ---------- */
function renderWizard(){
  const m=document.getElementById('app'); m.innerHTML='';
  const bar=el('div',{class:'steps-bar'});
  STEPS.forEach((s,i)=>{
    const tab=el('div',{class:'step-tab'+(i===S.step?' active':(i<S.step?' done':'')),onclick:()=>{S.step=i;renderWizard();}},String(i).padStart(2,'0')+' '+s.title);
    bar.append(tab);
  });
  m.append(bar);
  const body=el('div',{}); m.append(body);
  const st=STEPS[S.step];

  if(st.custom==='start'){
    body.append(el('div',{class:'folio'},st.folio));
    body.append(el('h2',{},'Ground rules'));
    body.append(el('p',{class:'step-intro'},'Nine folios. Answer what you can; skip what is undecided — the risk review will flag gaps. Everything stays on this machine until you export.'));
    body.append(el('ul',{class:'checklist'},
      el('li',{},'I will never type seed words, private keys, or full xpubs into this tool'),
      el('li',{},'I am working on a machine I trust, ideally offline'),
      el('li',{},'I understand nothing is saved until I export the file at the end'),
      el('li',{},'The encrypted file is a map: whoever holds it learns the STRUCTURE, but still cannot spend without the physical keys')));
    body.append(el('div',{class:'note'},'Estimated time: 30–60 minutes if your setup exists; longer if this questionnaire reveals it is still a story. That is the point of the exercise.'));
  } else if(st.custom==='vaults'){
    renderVaults(body);
  } else if(st.custom==='review'){
    renderReview(body);
  } else if(st.custom==='export'){
    renderExport(body);
  } else {
    body.append(el('div',{class:'folio'},st.folio));
    body.append(el('h2',{},st.title));
    body.append(el('p',{class:'step-intro'},st.intro));
    (st.fields||[]).forEach(f=>renderField(f,body));
    if(st.repeater) renderRepeater(st.repeater,body);
  }
  body.append(el('div',{class:'note warn'},el('strong',{},'Browser prototype only: '),
    'do not enter real plan details. Browser APIs cannot enforce the desktop app’s hardware gate.'));

  const nav=el('div',{class:'wiz-nav'});
  const prev=el('button',{class:'btn ghost',onclick:()=>{ if(S.step===0){ if(confirm('Leave the wizard? Unexported work will be lost.')) renderHome(); } else {S.step--;renderWizard();} }},S.step===0?'← Exit':'← Back');
  const pos=el('span',{class:'wiz-pos'},`Folio ${String(S.step).padStart(2,'0')} / ${String(STEPS.length-1).padStart(2,'0')}`);
  const next=el('button',{class:'btn',onclick:()=>{ if(S.step<STEPS.length-1){S.step++;renderWizard();window.scrollTo(0,0);} }},S.step===STEPS.length-1?'Done':'Continue →');
  nav.append(prev,pos,next);
  m.append(nav);
  window.scrollTo(0,0);
}

/* =====================================================================
   PART 5 — BROWSER NETWORK STATUS. This browser cannot verify physical
   network isolation. It makes no network requests and requires explicit
   user attestation before opening the offline fallback viewer.
   ===================================================================== */
const GATE = { passed:false, probing:false, btAttested:false };
function networkPresent(){ return navigator.onLine; }
async function bluetoothAdapterPresent(){
  try{
    if(!navigator.bluetooth||!navigator.bluetooth.getAvailability) return null; // unknown
    return await Promise.race([
      navigator.bluetooth.getAvailability(),
      new Promise(res=>setTimeout(()=>res(null),2000)),  // some engines never resolve
    ]);
  }catch(e){ return null; }
}

function renderGate(status){
  let g=document.getElementById('gate');
  if(!g){ g=el('div',{id:'gate'}); document.body.append(g); }
  g.innerHTML='';
  const box=el('div',{class:'gate-box'});
  box.append(el('div',{class:'folio'},'Vault Folio · Browser prototype'));
  box.append(el('h2',{},'Browser status check'));
  box.append(el('p',{},'This prototype makes no network requests, but browser APIs cannot verify that Wi-Fi, Bluetooth, Ethernet, or other network paths are physically disabled. Do not enter real plan details here. Use the native desktop app for real plans.'));
  const list=el('ul',{class:'gate-list'});
  box.append(list);
  box.append(el('p',{class:'small',style:'color:#8a8a84'},'To pass: disable Wi-Fi, disable Bluetooth, unplug Ethernet, and (best) physically remove wireless cards. Then re-check.'));
  const btnRow=el('div',{class:'btn-row'});
  const recheck=el('button',{class:'btn'},'Re-check environment');
  recheck.addEventListener('click',()=>runGate(true));
  btnRow.append(recheck);
  box.append(btnRow);
  g.append(box);
  paintGateStatus(list, status);
}
function paintGateStatus(list, status){
  list.innerHTML='';
  const li=(ok,label,sub)=>list.append(el('li',{class:ok===true?'good':ok===false?'bad':''},
    label+(sub?' — ':'')+(sub||'')));
  if(status.checking){
    li(null,'Checking browser network status…','this does not verify physical network isolation');
    if(status.bt===true) li(false,'Bluetooth is available to the browser','physical hardware state cannot be verified');
    else if(status.bt===false) li(true,'Browser reports Bluetooth unavailable','hardware may still be present');
    else li(null,'Bluetooth state unavailable','physical hardware state cannot be verified');
  } else if(status.online){
    li(false,'A network path exists',status.detail||'disable all networking and re-check');
  } else {
    li(true,'Browser reports offline','physical network isolation remains unverified');
    if(status.bt===true) li(false,'Browser reports Bluetooth available');
    else if(status.bt===false) li(true,'Browser reports Bluetooth unavailable','hardware may still be present');
    else li(null,'Bluetooth state unavailable','physical hardware state cannot be verified');
  }
}

async function runGate(manual){
  if(GATE.probing) return; GATE.probing=true;
  const bt=await bluetoothAdapterPresent();
  renderGate({checking:true, bt});
  const online=await networkPresent();
  GATE.probing=false;
  if(online){
    GATE.passed=false;
    renderGate({online:true, bt, detail:'the browser reports an active connection'});
    updateHdr(false);
    return;
  }
  if(!GATE.btAttested){
    renderGate({online:false, bt:true});
    const g=document.getElementById('gate');
    const box=g.querySelector('.gate-box');
    const att=el('label',{class:'attest'},
      el('input',{type:'checkbox',onchange:e=>{GATE.btAttested=e.target.checked;}}),
      el('span',{},'I have physically disabled or removed Wi-Fi, Bluetooth, Ethernet, and tethering. I understand this browser cannot verify that and will not use this fallback viewer for sensitive plans unless the machine is air-gapped.'));
    box.insertBefore(att, box.querySelector('.btn-row'));
    const cont=el('button',{class:'btn ghost',onclick:()=>{ if(GATE.btAttested){ GATE.passed=true; liftGate(); } else toast('Offline attestation required'); }},'Attest & enter');
    box.querySelector('.btn-row').append(cont);
    return;
  }
  GATE.passed=true;
  liftGate();
}
function liftGate(){
  const g=document.getElementById('gate'); if(g) g.remove();
  updateHdr(true);
  renderHome();
}
function updateHdr(ok){
  const d=document.getElementById('netDot'), l=document.getElementById('netLabel');
  if(ok){ d.className='dot'; l.textContent='Browser offline · isolation unverified'; }
  else { d.className='dot warn'; l.textContent='Network detected · locked'; }
}

/* mid-session re-lock: network appears → slam the overlay down */
async function guardLoop(){
  if(!GATE.passed || GATE.probing) return;
  const online=await networkPresent();
  if(online){
    GATE.passed=false;
    let ov=document.getElementById('lockOverlay');
    if(!ov){
      ov=el('div',{id:'lockOverlay'});
      const box=el('div',{class:'gate-box'});
      box.append(el('div',{class:'folio'},'Session locked'));
      box.append(el('h2',{},'A network appeared.'));
      box.append(el('p',{},'The browser reports a network connection. Disable Wi-Fi / Bluetooth / Ethernet. The browser cannot verify physical isolation; confirm the machine is air-gapped before resuming.'));
      box.append(el('button',{class:'btn',onclick:async()=>{
        const stillOnline=await networkPresent();
        if(!stillOnline){ ov.remove(); GATE.passed=true; updateHdr(true); }
        else toast('Network still present');
      }},'I am offline again — resume'));
      ov.append(box); document.body.append(ov);
    }
    updateHdr(false);
  }
}
window.addEventListener('online',()=>{ guardLoop(); });
window.addEventListener('offline',()=>{ /* do not auto-resume; user confirms via overlay */ });
setInterval(()=>{ if(GATE.passed) guardLoop(); }, 15000);

/* ---------- boot ---------- */
runGate();
</script>
