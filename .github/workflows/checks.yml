name: Offline software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install cryptography
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -B vault-folio.py --self-test
      # Under Xvfb the GUI tests run instead of skipping (23 of the suite).
      - run: xvfb-run -a python -B -m unittest discover -s tests -v
      - run: node tests/browser_crypto.cjs
